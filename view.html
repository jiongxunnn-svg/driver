<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#2f4fd8">
<title>司机票据</title>
<style>
  :root {
    --bg: #f2f4f8; --card: #fff; --text: #1d2635; --muted: #6b778c; --faint: #9aa4b5; --line: #e6e9ef;
    --blue: #2f4fd8; --green: #1f8a55; --orange: #c56a12; --red: #c9372c;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { overflow-x: hidden; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; }
  button { font: inherit; color: inherit; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 12px calc(24px + env(safe-area-inset-bottom)); }

  header { position: sticky; top: 0; z-index: 5; background: var(--blue); color: #fff; padding: calc(10px + env(safe-area-inset-top)) 12px 10px; }
  .bar { max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 8px; }
  .bar h1 { flex: 1; margin: 0; font-size: 17px; font-weight: 700; }
  .month { display: flex; align-items: center; background: rgba(255,255,255,.16); border-radius: 9px; }
  .month button { width: 34px; height: 32px; border: 0; background: none; font-size: 18px; cursor: pointer; }
  .month span { min-width: 82px; text-align: center; font-weight: 600; font-size: 14px; }
  .round { width: 34px; height: 32px; border: 0; border-radius: 9px; background: rgba(255,255,255,.16); font-size: 16px; cursor: pointer; }

  .card { margin-top: 12px; padding: 14px; border-radius: 12px; background: var(--card); box-shadow: 0 1px 2px rgba(20,30,50,.05); }
  .total-label { color: var(--muted); font-size: 13px; }
  .total { margin: 2px 0 2px; font-size: 30px; font-weight: 800; letter-spacing: -.5px; font-variant-numeric: tabular-nums; }
  .total small { font-size: 15px; font-weight: 600; color: var(--muted); margin-right: 4px; }
  .total-sub { color: var(--muted); font-size: 13px; }
  .seg { display: flex; gap: 4px; margin: 14px 0 6px; padding: 3px; border-radius: 9px; background: #eef1f6; }
  .seg button { flex: 1; height: 30px; border: 0; border-radius: 7px; background: none; color: var(--muted); font-size: 13px; cursor: pointer; }
  .seg button.on { background: #fff; color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .brk { display: block; width: 100%; padding: 9px 2px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; cursor: pointer; }
  .brk:last-child { border-bottom: 0; }
  .brk.on { background: #f3f5ff; border-radius: 8px; }
  .brk-top { display: flex; align-items: baseline; gap: 8px; }
  .brk-name { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-weight: 600; }
  .brk-n { color: var(--faint); font-size: 12px; }
  .brk-amt { font-weight: 700; font-variant-numeric: tabular-nums; }
  .brk-track { height: 5px; margin-top: 6px; border-radius: 3px; background: #eef1f6; overflow: hidden; }
  .brk-fill { height: 100%; border-radius: 3px; background: var(--blue); }

  .warn { margin-top: 12px; padding: 11px 14px; border-radius: 12px; background: #fff6ea; color: #8a4d0b; font-size: 13px; }
  .warn summary { cursor: pointer; font-weight: 600; }
  .warn-row { display: flex; gap: 10px; align-items: center; padding: 8px 0 0; }

  .filter { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  .filter input { flex: 1; min-width: 0; height: 38px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; font: inherit; font-size: 14px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; height: 30px; padding: 0 10px; border: 0; border-radius: 15px; background: #e6eaff; color: var(--blue); font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }

  .day { display: flex; justify-content: space-between; margin: 16px 4px 6px; color: var(--muted); font-size: 13px; }
  .day b { color: var(--text); }
  .list { overflow: hidden; border-radius: 12px; background: var(--card); }
  .item { display: flex; gap: 11px; width: 100%; padding: 10px 12px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; cursor: pointer; }
  .item.got { background: #fbfefc; }
  .pp { flex: 0 0 auto; align-self: center; min-width: 62px; height: 38px; padding: 0 8px; border: 1px solid #f1c48f; border-radius: 9px; background: #fff8ef; color: var(--orange); font-size: 12px; font-weight: 700; line-height: 1.15; cursor: pointer; }
  .pp.on { border-color: #a9dfc2; background: #e9f8f0; color: var(--green); }
  .paperbar { display: flex; gap: 6px; margin-top: 12px; }
  .paperbar button { flex: 1; min-width: 0; height: 46px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--muted); font-size: 12px; font-weight: 600; cursor: pointer; }
  .paperbar button b { display: block; font-size: 15px; color: var(--text); line-height: 1.2; }
  .paperbar button.on { border-color: var(--blue); background: #eef1ff; color: var(--blue); }
  .paperbar button.on b { color: var(--blue); }
  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); z-index: 40; transform: translateX(-50%); max-width: 90%; padding: 9px 16px; border-radius: 10px; background: rgba(20,26,38,.92); color: #fff; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .25s; }
  .toast.on { opacity: 1; }
  .spin { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .v-paper { width: 100%; height: 42px; margin-top: 8px; border: 0; border-radius: 10px; background: #ffb257; color: #3a2100; font-size: 15px; font-weight: 700; cursor: pointer; }
  .v-paper.on { background: #2fb36f; color: #fff; }
  .item:last-child { border-bottom: 0; }
  .item:active { background: #f6f7fb; }
  .thumb { position: relative; width: 58px; height: 58px; flex: 0 0 58px; overflow: hidden; border-radius: 8px; background: #e9ecf2; color: var(--faint); font-size: 10px; display: flex; align-items: center; justify-content: center; text-align: center; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .thumb .g { position: absolute; right: 2px; bottom: 2px; padding: 0 4px; border-radius: 5px; background: rgba(0,0,0,.6); color: #fff; font-size: 10px; line-height: 16px; }
  .info { flex: 1; min-width: 0; }
  .l1 { display: flex; align-items: baseline; gap: 8px; }
  .cat { font-weight: 700; }
  .amt { margin-left: auto; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .l2 { margin-top: 2px; overflow: hidden; color: var(--muted); font-size: 13px; white-space: nowrap; text-overflow: ellipsis; }
  .tags { margin-top: 3px; display: flex; flex-wrap: wrap; gap: 4px; }
  .tag { padding: 0 6px; border-radius: 5px; font-size: 11px; line-height: 18px; background: #eef1f6; color: var(--muted); }
  .tag.ok { background: #e3f6ec; color: var(--green); }
  .tag.bad { background: #fdecea; color: var(--red); }
  .tag.mid { background: #fff1e0; color: var(--orange); }

  .empty, .msg { padding: 40px 16px; color: var(--muted); text-align: center; }
  .gate { max-width: 360px; margin: 60px auto 0; padding: 22px; border-radius: 14px; background: #fff; text-align: center; }
  .gate input { width: 100%; height: 44px; margin: 14px 0 10px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; font: inherit; text-align: center; letter-spacing: 1px; }
  .btn { width: 100%; height: 44px; border: 0; border-radius: 10px; background: var(--blue); color: #fff; font-weight: 700; cursor: pointer; }
  .err { color: var(--red); font-size: 13px; min-height: 18px; }

  /* 看大图 */
  .viewer { position: fixed; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; z-index: 20; display: none; flex-direction: column; overflow: hidden; background: #0d1017; color: #fff; }
  .viewer.show { display: flex; }
  /* 按钮放在下面：顶上会被手机状态栏挡住，而且下面手指好按 */
  .v-top { display: flex; align-items: center; gap: 8px; padding: 6px 12px calc(10px + env(safe-area-inset-bottom)); background: #161b25; }
  .v-top .round { width: 44px; height: 40px; font-size: 22px; }
  .v-top .round { background: rgba(255,255,255,.12); color: #fff; }
  .v-back { flex: 0 0 auto; height: 40px; padding: 0 14px 0 10px; border: 0; border-radius: 18px; background: #fff; color: #111; font-size: 15px; font-weight: 700; cursor: pointer; }
  .v-tabs { flex: 1; min-width: 0; display: flex; justify-content: center; gap: 6px; }
  .v-tab { height: 32px; padding: 0 10px; white-space: nowrap; border: 0; border-radius: 15px; background: rgba(255,255,255,.12); color: #cfd5e2; font-size: 13px; cursor: pointer; }
  .v-tab.on { background: #fff; color: #111; font-weight: 600; }
  .stage { position: relative; flex: 1; overflow: hidden; touch-action: none; display: flex; align-items: center; justify-content: center; }
  .stage img { max-width: 100%; max-height: 100%; transform-origin: center center; user-select: none; -webkit-user-drag: none; will-change: transform; }
  .stage .none { color: #8d96a8; }
  .zoom-pct { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); padding: 2px 10px; border-radius: 10px; background: rgba(0,0,0,.55); font-size: 12px; opacity: 0; transition: opacity .3s; pointer-events: none; }
  .zoom-pct.on { opacity: 1; }
  .v-info { padding: 10px 14px 4px; background: #161b25; font-size: 13px; color: #c3cad8; overflow-wrap: anywhere; }
  .v-info .big span:last-child { white-space: nowrap; margin-left: 10px; }
  .v-info .big { display: flex; justify-content: space-between; color: #fff; font-size: 16px; font-weight: 700; }
  .v-info a { color: #8fb0ff; }
  .v-hint { color: #7d879a; font-size: 11px; margin-top: 4px; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>司机票据</h1>
    <div class="month" id="monthBox" hidden>
      <button id="prevMonth" aria-label="上个月">‹</button><span id="monthLabel"></span><button id="nextMonth" aria-label="下个月">›</button>
    </div>
    <button class="round" id="reload" aria-label="刷新" hidden>↻</button>
  </div>
</header>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<div class="viewer" id="viewer">
  <div class="stage" id="stage"><div class="zoom-pct" id="zoomPct"></div></div>
  <div class="v-info" id="vInfo"></div>
  <div class="v-top">
    <button class="v-back" id="vClose">‹ 返回</button>
    <div class="v-tabs" id="vTabs"></div>
    <button class="round" id="vPrev" aria-label="上一张">‹</button>
    <button class="round" id="vNext" aria-label="下一张">›</button>
  </div>
</div>

<script>
// ============ 设置（和司机上传页面用同一个 Supabase 项目）============
const SUPABASE_URL = "https://klltpjccnretfccnrvpo.supabase.co";
const SUPABASE_KEY = "sb_publishable_xFOiQOnp0CbPfwu18oN1xQ_exb8LpF9";
// =====================================================================
const CATS = { "Fuel": "油费", "Parking": "停车费", "Car Repair": "修车", "Overtime Meal": "加班餐", "Car Wash": "洗车" };
const WEEK = "日一二三四五六";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = n => Number(n || 0).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pad = n => String(n).padStart(2, "0");
const hm = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const photoUrl = path => `${SUPABASE_URL}/storage/v1/object/public/receipts/${path}`;
let toastTimer = 0;
function toast(msg, ms = 2500) { const t = $("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("on"), ms); }
function headers() {
  const h = { apikey: SUPABASE_KEY, "Content-Type": "application/json" };
  if (SUPABASE_KEY.startsWith("eyJ")) h.Authorization = "Bearer " + SUPABASE_KEY;
  return h;
}
function store(k, v) { try { v === undefined ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } }

const state = { key: "", month: new Date(), items: [], waiting: [], by: "cat", pick: "", q: "", paper: "all", loading: false, at: null };
state.month.setDate(1);

// 口令：链接里的 ?v=… 或者手动输入一次，之后记在这台手机上
(function initKey() {
  const url = new URL(location.href);
  const fromLink = url.searchParams.get("v");
  if (fromLink) {
    store("viewKey", fromLink);
    url.searchParams.delete("v");
    history.replaceState(null, "", url.pathname + url.search + url.hash);
  }
  state.key = load("viewKey");
})();

function gate(error) {
  $("monthBox").hidden = $("reload").hidden = true;
  $("app").innerHTML = `<div class="gate"><div style="font-size:34px">🔒</div><b>请输入查看口令</b>
    <div class="total-sub">口令在管理员那里，输入一次后这台手机会记住</div>
    <input id="keyInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="查看口令">
    <div class="err">${esc(error || "")}</div><button class="btn" id="keyGo">进入</button></div>`;
  const go = () => { const v = $("keyInput").value.trim(); if (v) { state.key = v; store("viewKey", v); fetchMonth(); } };
  $("keyGo").onclick = go;
  $("keyInput").onkeydown = e => { if (e.key === "Enter") go(); };
}

async function fetchMonth(quiet = false) {
  if (!state.key) return gate();
  if (quiet && state.loading) return;
  $("monthBox").hidden = $("reload").hidden = false;
  const m = state.month;
  $("monthLabel").textContent = `${m.getFullYear()}年${m.getMonth() + 1}月`;
  const from = new Date(m.getFullYear(), m.getMonth(), 1), to = new Date(m.getFullYear(), m.getMonth() + 1, 1);
  state.loading = true;
  if (!state.items.length) $("app").innerHTML = `<div class="msg">正在加载…</div>`;
  const ask = `${from.toISOString()}|${to.toISOString()}`;
  state.ask = ask;
  $("reload").classList.add("spin");
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/view_receipts`, {
      method: "POST", headers: headers(), cache: "no-store", body: JSON.stringify({ p_key: state.key, p_from: from.toISOString(), p_to: to.toISOString() }),
    });
    const text = await res.text();
    if (state.ask !== ask) return;
    if (!res.ok) {
      if (text.includes("BAD_LINK")) { store("viewKey"); state.key = ""; return gate("口令不对，请重新输入"); }
      if (res.status === 404 || text.includes("PGRST202")) throw new Error("云端还没更新：请先在 Supabase 运行新版建表脚本");
      throw new Error("服务器返回错误 " + res.status);
    }
    const data = JSON.parse(text);
    // 类别、金额以电脑上票夹里的为准（电脑改过就显示改过的）
    state.items = (data.items || []).map(x => Object.assign(x, { at: new Date(x.created_at), name: x.pc_category || CATS[x.category] || x.category,
      amount: Number(x.amount), driverAmount: Number(x.driver_amount ?? x.amount), paper: !!x.paper }));
    state.waiting = (data.waiting || []).map(x => Object.assign(x, { at: new Date(x.created_at) }));
    state.at = new Date();
    if (quiet) refreshQuietly(); else render();
    if (state.manual) toast("已刷新，和电脑上一致");
    state.manual = false;
  } catch (e) {
    if (state.ask !== ask) return;
    if (quiet) return;   // 自动刷新失败不打扰，下次再试
    $("app").innerHTML = `<div class="msg">😕 ${esc(e.message === "Failed to fetch" ? "连不上网络，请稍后点右上角 ↻ 再试" : e.message)}</div>`;
  } finally { state.loading = false; $("reload").classList.remove("spin"); }
}
// 自动刷新：正在打字、正在看大图时不重画整页，免得打断
function refreshQuietly() {
  if (document.activeElement && document.activeElement.id === "q") return renderList();
  if ($("viewer").classList.contains("show")) return;
  const y = window.scrollY;
  render();
  window.scrollTo(0, y);
}
setInterval(() => { if (document.visibilityState === "visible" && state.key && !$("viewer").classList.contains("show")) fetchMonth(true); }, 20000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && state.key && state.at && Date.now() - state.at > 5000) fetchMonth(true); });

// 标记纸质票收到 / 没收到：手机上先改，再告诉云端；电脑上的票夹十几秒内跟着改
async function setPaper(x, value) {
  const old = x.paper;
  x.paper = value;
  paintPaper(x);
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/set_paper`, {
      method: "POST", headers: headers(), body: JSON.stringify({ p_key: state.key, p_code: x.code, p_received: value }),
    });
    const text = await res.text();
    if (!res.ok) {
      if (res.status === 404 || text.includes("PGRST202")) throw new Error("云端还没更新：请先在 Supabase 运行新版建表脚本");
      if (text.includes("NOT_FOUND")) throw new Error("这张票已经在电脑上删掉了");
      if (text.includes("BAD_LINK")) throw new Error("口令不对");
      throw new Error("服务器返回错误 " + res.status);
    }
    toast(value ? `#${x.code} 已标记：收到纸质票` : `#${x.code} 已改回：没收到纸质票`);
  } catch (e) {
    x.paper = old;
    paintPaper(x);
    toast("没改成：" + (e.message === "Failed to fetch" ? "连不上网络" : e.message), 4000);
  }
}
function paintPaper(x) {
  if ($("viewer").classList.contains("show") && V.list[V.i] === x) showItem(V.tab);
  const y = window.scrollY;
  render();
  window.scrollTo(0, y);
}

function groupKey(x) { return state.by === "cat" ? x.name : state.by === "plate" ? x.plate : x.driver; }
function filtered() {
  const q = state.q.toLowerCase();
  return state.items.filter(x => (!state.pick || groupKey(x) === state.pick)
    && (state.paper === "all" || (state.paper === "yes") === x.paper)
    && (!q || `${x.plate} ${x.driver} ${x.code} ${x.name} ${x.amount}`.toLowerCase().includes(q)));
}

function render() {
  const all = state.items;
  const total = all.reduce((t, x) => t + x.amount, 0);
  const groups = new Map();
  for (const x of all) {
    const k = groupKey(x);
    const g = groups.get(k) || { k, n: 0, sum: 0 };
    g.n++; g.sum += x.amount;
    groups.set(k, g);
  }
  const rows = [...groups.values()].sort((a, b) => b.sum - a.sum);
  const max = rows.length ? rows[0].sum : 0;
  const noGauge = all.filter(x => x.category === "Fuel" && !x.gauge).length;

  let html = `<div class="card">
    <div class="total-label">本月合计（和电脑上票夹一致）</div>
    <div class="total"><small>SAR</small>${money(total)}</div>
    <div class="total-sub">共 ${all.length} 笔 · ${new Set(all.map(x => x.driver)).size} 位司机 · ${new Set(all.map(x => x.plate)).size} 辆车${state.at ? ` · ${hm(state.at)} 更新` : ""}</div>
    <div class="seg">${[["cat", "按类别"], ["plate", "按车辆"], ["driver", "按司机"]].map(([k, t]) => `<button data-by="${k}" class="${state.by === k ? "on" : ""}">${t}</button>`).join("")}</div>
    ${rows.map(g => `<button class="brk ${state.pick === g.k ? "on" : ""}" data-pick="${esc(g.k)}">
      <div class="brk-top"><span class="brk-name">${esc(g.k)}</span><span class="brk-n">${g.n} 笔 · ${total ? Math.round(g.sum / total * 100) : 0}%</span><span class="brk-amt">${money(g.sum)}</span></div>
      <div class="brk-track"><div class="brk-fill" style="width:${max ? (g.sum / max * 100).toFixed(1) : 0}%"></div></div></button>`).join("") || `<div class="empty" style="padding:16px">这个月还没有司机上传</div>`}
  </div>`;

  if (state.waiting.length || noGauge) {
    html += `<details class="warn"><summary>⚠️ ${state.waiting.length ? `拍了加油前油量、还没交收据：${state.waiting.length} 次` : ""}${state.waiting.length && noGauge ? "；" : ""}${noGauge ? `油费没有油量照片：${noGauge} 笔` : ""}</summary>
      ${state.waiting.map((w, i) => `<div class="warn-row" data-wait="${i}" style="cursor:pointer"><div class="thumb" style="width:44px;height:44px;flex-basis:44px">${w.photo ? `<img loading="lazy" src="${photoUrl(w.photo)}" alt="" onerror="this.outerHTML='已清理'">` : "已清理"}</div>
        <div>${esc(w.plate)} · ${esc(w.driver)}<br><span style="opacity:.75">${w.at.getMonth() + 1}月${w.at.getDate()}日 ${hm(w.at)} · #${esc(w.code)}</span></div></div>`).join("")}
      ${noGauge ? `<div style="padding-top:8px;opacity:.8">没有油量照片的油费，多半是加油前拍照功能上线以前交的。</div>` : ""}</details>`;
  }

  const got = all.filter(x => x.paper).length;
  html += `<div class="paperbar">${[["all", "全部", all.length], ["no", "纸质票没收到", all.length - got], ["yes", "纸质票已收到", got]]
    .map(([k, t, n]) => `<button data-paper-filter="${k}" class="${state.paper === k ? "on" : ""}"><b>${n} 笔</b>${t}</button>`).join("")}</div>`;
  html += `<div class="filter"><input id="q" type="search" placeholder="搜车牌、司机、编号、金额" value="${esc(state.q)}">
    ${state.pick ? `<button class="chip" id="clearPick">${esc(state.pick)} ✕</button>` : ""}</div>`;
  $("app").innerHTML = html + `<div id="listBox"></div>`;
  renderList();
}

function renderList() {
  const all = state.items, list = filtered();
  const listSum = list.reduce((t, x) => t + x.amount, 0);
  let html = "";
  if (state.pick || state.q || state.paper !== "all") html += `<div class="day"><span>筛选出 ${list.length} 笔</span><b>SAR ${money(listSum)}</b></div>`;

  let lastDay = "";
  let open = false;
  list.forEach((x, i) => {
    const d = x.at, day = `${d.getMonth() + 1}月${d.getDate()}日 周${WEEK[d.getDay()]}`;
    if (day !== lastDay) {
      if (open) html += `</div>`;
      const sum = list.filter(y => y.at.toDateString() === d.toDateString()).reduce((t, y) => t + y.amount, 0);
      html += `<div class="day"><span>${day}</span><b>${money(sum)}</b></div><div class="list">`;
      lastDay = day; open = true;
    }
    const tags = [];
    if (x.category === "Fuel") {
      if (!x.gauge) tags.push(`<span class="tag bad">没有油量照片</span>`);
      else {
        const gap = Math.max(0, Math.round((x.at - new Date(x.gauge.created_at)) / 60000));
        tags.push(`<span class="tag ok">⛽ 加油前已拍 · 隔 ${gap >= 60 ? Math.floor(gap / 60) + " 小时 " : ""}${gap % 60} 分</span>`);
        if (x.gauge.live === false) tags.push(`<span class="tag mid">系统相机</span>`);
      }
    }
    if (!x.synced) tags.push(`<span class="tag">票夹还没收</span>`);
    if (x.pc_status === "已报销") tags.push(`<span class="tag ok">已报销</span>`);
    if (Math.abs(x.driverAmount - x.amount) > 0.004) tags.push(`<span class="tag mid">司机填 ${money(x.driverAmount)}，电脑上改过</span>`);
    html += `<div class="item ${x.paper ? "got" : ""}" data-i="${i}" role="button">
      <div class="thumb">${x.photo ? `<img loading="lazy" decoding="async" src="${photoUrl(x.photo)}" alt="" onerror="this.outerHTML='照片<br>已清理'">` : "照片<br>已清理"}${x.gauge && x.gauge.photo ? `<span class="g">2张</span>` : ""}</div>
      <div class="info"><div class="l1"><span class="cat">${esc(x.name)}</span><span class="amt">${money(x.amount)}</span></div>
        <div class="l2">${esc(x.plate)} · ${esc(x.driver)} · ${hm(d)} · #${esc(x.code)}</div>
        ${tags.length ? `<div class="tags">${tags.join("")}</div>` : ""}</div>
      <button class="pp ${x.paper ? "on" : ""}" data-pp="${i}">${x.paper ? "✓ 已收<br>纸质票" : "没收<br>纸质票"}</button></div>`;
  });
  if (open) html += `</div>`;
  if (!list.length && all.length) html += `<div class="empty">${state.paper === "no" && !state.q && !state.pick ? "🎉 这个月的纸质票都收齐了" : "没有符合条件的票据"}</div>`;
  $("listBox").innerHTML = html;
}

$("app").addEventListener("click", e => {
  const by = e.target.closest("[data-by]");
  if (by) { state.by = by.dataset.by; state.pick = ""; return render(); }
  const pick = e.target.closest("[data-pick]");
  if (pick) { state.pick = state.pick === pick.dataset.pick ? "" : pick.dataset.pick; return render(); }
  if (e.target.closest("#clearPick")) { state.pick = ""; return render(); }
  const pf = e.target.closest("[data-paper-filter]");
  if (pf) { state.paper = pf.dataset.paperFilter; return render(); }
  const pp = e.target.closest("[data-pp]");
  if (pp) { const x = filtered()[+pp.dataset.pp]; if (x) setPaper(x, !x.paper); return; }
  const item = e.target.closest("[data-i]");
  if (item) return openViewer(filtered(), +item.dataset.i);
  const wait = e.target.closest("[data-wait]");
  if (wait) return openViewer(state.waiting.map(w => ({ waiting: true, code: w.code, at: w.at, plate: w.plate, driver: w.driver, gauge: w, name: "加油前油量（还没交收据）" })), +wait.dataset.wait, 1);
});
$("app").addEventListener("input", e => {
  if (e.target.id !== "q") return;
  state.q = e.target.value;
  renderList();
});
function moveMonth(d) { state.month = new Date(state.month.getFullYear(), state.month.getMonth() + d, 1); state.pick = ""; state.items = []; fetchMonth(); }
$("prevMonth").onclick = () => moveMonth(-1);
$("nextMonth").onclick = () => moveMonth(1);
$("reload").onclick = () => { state.manual = true; fetchMonth(); };

// ============ 看大图：双指/滚轮放大，拖动移动，双击放大或还原，左右滑换下一张 ============
const V = { list: [], i: 0, tab: 0, s: 1, x: 0, y: 0, img: null };
function photosOf(x) {
  const out = [];
  if (!x.waiting) out.push({ label: "收据", path: x.photo });
  if (x.gauge) out.push({ label: "加油前油量", path: x.gauge.photo });
  return out;
}
function openViewer(list, i, tab = 0) {
  V.list = list; V.i = i;
  if (!$("viewer").classList.contains("show")) history.pushState({ viewer: true }, "");
  $("viewer").classList.add("show");
  document.body.style.overflow = "hidden";
  themeColor("#0d1017");
  showItem(tab === 1 && list[i].waiting ? 0 : tab);
}
// 看大图时在浏览器历史里多记一步：手机的返回键 / 返回手势先关掉大图，不会直接退出页面
function closeViewer() {
  if (!$("viewer").classList.contains("show")) return;
  if (history.state && history.state.viewer) return history.back();   // 交给下面的 popstate 关
  hideViewer();
}
function hideViewer() { $("viewer").classList.remove("show"); document.body.style.overflow = ""; themeColor("#2f4fd8"); }
function themeColor(c) { const m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = c; }
function showItem(tab = 0) {
  const x = V.list[V.i], photos = photosOf(x);
  V.tab = Math.min(tab, photos.length - 1);
  $("vTabs").innerHTML = photos.length > 1 ? photos.map((p, k) => `<button class="v-tab ${k === V.tab ? "on" : ""}" data-tab="${k}">${p.label}</button>`).join("") : `<span style="font-size:13px;color:#cfd5e2">${esc(photos[0].label)}</span>`;
  $("vPrev").disabled = V.i <= 0; $("vNext").disabled = V.i >= V.list.length - 1;
  $("vPrev").style.opacity = V.i <= 0 ? .35 : 1; $("vNext").style.opacity = V.i >= V.list.length - 1 ? .35 : 1;
  const p = photos[V.tab];
  const stage = $("stage");
  stage.querySelectorAll("img, .none").forEach(n => n.remove());
  if (p.path) {
    const img = new Image();
    img.src = photoUrl(p.path);
    img.alt = p.label;
    img.draggable = false;
    img.onerror = () => { img.remove(); V.img = null; stage.insertAdjacentHTML("beforeend", `<div class="none">照片已从云端清理（电脑上的票夹里有）</div>`); };
    stage.appendChild(img);
    V.img = img;
  } else {
    stage.insertAdjacentHTML("beforeend", `<div class="none">照片已从云端清理（电脑上的票夹里有）</div>`);
    V.img = null;
  }
  setT(1, 0, 0);
  const g = x.gauge;
  let gaugeLine = "";
  if (g) {
    const gt = new Date(g.created_at);
    const gap = x.waiting ? "" : `，交收据前 ${Math.max(0, Math.round((x.at - gt) / 60000))} 分钟`;
    const map = g.lat != null && g.lng != null ? ` · <a href="https://maps.google.com/?q=${g.lat},${g.lng}" target="_blank" rel="noopener">拍照位置</a>` : " · 没有位置";
    gaugeLine = `<div>⛽ 加油前油量 ${gt.getMonth() + 1}/${gt.getDate()} ${hm(gt)} #${esc(g.code)}${gap}${map}${g.live === false ? " · 用的系统相机" : ""}</div>`;
  } else if (x.category === "Fuel") gaugeLine = `<div style="color:#ff9b8f">这笔油费没有加油前油量照片</div>`;
  $("vInfo").innerHTML = `<div class="big"><span>${esc(x.name)}</span><span>${x.waiting ? "" : "SAR " + money(x.amount)}</span></div>
    <div>${esc(x.plate)} · ${esc(x.driver)} · ${x.at.getMonth() + 1}月${x.at.getDate()}日 ${hm(x.at)} · #${esc(x.code)}　${V.i + 1}/${V.list.length}</div>
    ${gaugeLine}${x.waiting ? "" : `<button class="v-paper ${x.paper ? "on" : ""}" id="vPaper">${x.paper ? "✓ 纸质票已收到（点一下改回没收到）" : "收到纸质票了？点这里标记"}</button>`}<div class="v-hint">双指或滚轮放大 · 双击放大/还原 · 没放大时左右滑动换一张</div>`;
}
function setT(s, x, y) {
  V.s = s; V.x = x; V.y = y;
  if (V.img) V.img.style.transform = `translate(${x}px, ${y}px) scale(${s})`;
  const pct = $("zoomPct");
  pct.textContent = Math.round(s * 100) + "%";
  pct.classList.toggle("on", s !== 1);
}
// 以屏幕上的某一点为中心缩放（坐标相对舞台中心）
function zoomAt(s2, cx, cy) {
  s2 = Math.min(8, Math.max(1, s2));
  const r = $("stage").getBoundingClientRect();
  const qx = cx - r.left - r.width / 2, qy = cy - r.top - r.height / 2;
  if (s2 === 1) return setT(1, 0, 0);
  setT(s2, qx - (qx - V.x) * s2 / V.s, qy - (qy - V.y) * s2 / V.s);
}
const pts = new Map();
let gesture = null, lastTap = 0;
const stage = $("stage");
stage.addEventListener("pointerdown", e => {
  stage.setPointerCapture(e.pointerId);
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pts.size === 2) {
    const [a, b] = [...pts.values()];
    gesture = { pinch: true, d: Math.hypot(a.x - b.x, a.y - b.y), s: V.s };
  } else if (pts.size === 1) {
    gesture = { pinch: false, sx: e.clientX, sy: e.clientY, x: V.x, y: V.y, moved: false };
  }
});
stage.addEventListener("pointermove", e => {
  if (!pts.has(e.pointerId) || !gesture) return;
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (gesture.pinch && pts.size >= 2) {
    const [a, b] = [...pts.values()];
    zoomAt(gesture.s * Math.hypot(a.x - b.x, a.y - b.y) / gesture.d, (a.x + b.x) / 2, (a.y + b.y) / 2);
  } else if (!gesture.pinch) {
    const dx = e.clientX - gesture.sx, dy = e.clientY - gesture.sy;
    if (Math.abs(dx) + Math.abs(dy) > 6) gesture.moved = true;
    if (V.s > 1) setT(V.s, gesture.x + dx, gesture.y + dy);
  }
});
function endPointer(e) {
  if (!pts.has(e.pointerId)) return;
  pts.delete(e.pointerId);
  if (gesture && !gesture.pinch && pts.size === 0) {
    const dx = e.clientX - gesture.sx, dy = e.clientY - gesture.sy;
    if (V.s === 1 && Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      step(dx < 0 ? 1 : -1);
    } else if (!gesture.moved && e.type === "pointerup") {
      const now = Date.now();
      if (now - lastTap < 320) { zoomAt(V.s > 1 ? 1 : 2.5, e.clientX, e.clientY); lastTap = 0; }
      else lastTap = now;
    }
  }
  if (pts.size === 0) gesture = null;
  else if (pts.size === 1) {   // 双指松开一根：接着拖动
    const [p] = [...pts.values()];
    gesture = { pinch: false, sx: p.x, sy: p.y, x: V.x, y: V.y, moved: true };
  }
}
stage.addEventListener("pointerup", endPointer);
stage.addEventListener("pointercancel", endPointer);
stage.addEventListener("wheel", e => { e.preventDefault(); zoomAt(V.s * (e.deltaY < 0 ? 1.2 : 1 / 1.2), e.clientX, e.clientY); }, { passive: false });
function step(d) {
  const n = V.i + d;
  if (n < 0 || n >= V.list.length) return;
  V.i = n;
  showItem(0);
}
$("vPrev").onclick = () => step(-1);
$("vNext").onclick = () => step(1);
$("vClose").onclick = closeViewer;
$("vInfo").addEventListener("click", e => { if (e.target.id === "vPaper") { const x = V.list[V.i]; setPaper(x, !x.paper); } });
$("vTabs").addEventListener("click", e => { const t = e.target.closest("[data-tab]"); if (t) showItem(+t.dataset.tab); });
document.addEventListener("keydown", e => {
  if (!$("viewer").classList.contains("show")) return;
  if (e.key === "Escape") closeViewer();
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "ArrowRight") step(1);
});
window.addEventListener("popstate", hideViewer);

fetchMonth();
</script>
</body>
</html>
